[versions]
agp = "9.2.1"
kotlin = "2.3.21"
coreKtx = "1.19.0"
appcompat = "1.7.1"
material = "1.14.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycleRuntimeKtx = "2.11.0"
webkit = "1.16.0"
playBilling = "8.3.0"
playServicesAds = "25.5.0"
playServicesAuth = "21.3.0"
playReview = "2.0.2"
huaweiIap = "6.13.0.300"
huaweiAds = "13.4.74.300"
huaweiPush = "6.13.0.301"
huaweiAnalytics = "6.12.0.301"
firebaseBom = "34.16.0"
kotlinxCoroutinesAndroid = "1.11.0"
datastorePreferences = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Coroutines & Storage
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

# In-App Billing (Google Play & Huawei)
google-play-billing = { module = "com.android.billingclient:billing-ktx", version.ref = "playBilling" }
huawei-iap = { module = "com.huawei.hms:iap", version.ref = "huaweiIap" }

# Ads (Google AdMob & Huawei)
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
huawei-ads = { module = "com.huawei.hms:ads-lite", version.ref = "huaweiAds" }

# Push Notifications & Analytics
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
huawei-push = { module = "com.huawei.hms:push", version.ref = "huaweiPush" }
huawei-analytics = { module = "com.huawei.hms:hianalytics", version.ref = "huaweiAnalytics" }

# In-App Review
google-play-review = { module = "com.google.android.play:review-ktx", version.ref = "playReview" }

# Authentication
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
